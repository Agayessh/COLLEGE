<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="script" href="script.js">
</head>
<body>
    <div class = "calculator">
        <table>
            <tr>
                    <td colspan="4"><div class = "display" id = "display"></div></td>
            <tr>
                <td><button class = "operator" data-action="add">+</button></td>
                <td><button class = "operator" data-action="subtract">-</button></td>
                <td><button class = "operator" data-action="multiply">*</button></td>
                <td><button class = "operator" data-action="divide">/</button></td>
            </tr>

            <tr>
                <td><button>7</button></td>
                <td><button>8</button></td>
                <td><button>9</button></td>
                <td><button>4</button></td>
            </tr>

            <tr>
                <td><button>5</button></td>
                <td><button>6</button></td>
                <td><button>1</button></td>
                <td><button>2</button></td>
            </tr>
            <tr>
                <td><button>3</button></td>
                <td><button>0</button></td>
                <td><button data-action = "decimal">.</button></td>
                <td><button data-action = "clear">AC</button></td>
                <td><button class = "equal-sign" data-action = "calculate">=</button></td>
            </tr>
        </table>
    </div>
</body>
</html>
